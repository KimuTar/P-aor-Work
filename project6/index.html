<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานการตรวจสอบคุณสมบัติผู้สมัครรับทุนการศึกษา ปริญญาเอก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0b1f38;
    --navy-900:#0f2a4a;
    --navy-800:#153a5f;
    --navy-700:#1c4a76;
    --gold-500:#c9a227;
    --gold-400:#dab94a;
    --gold-100:#f6ecc9;
    --cream:#faf7ef;
    --paper:#ffffff;
    --ink:#1e2a37;
    --ink-soft:#5b6b7c;
    --line:#e4dfd0;
    --green:#1f8a5b;
    --green-bg:#e6f5ee;
    --red:#c0453a;
    --red-bg:#fbeae8;
    --amber:#b8791a;
    --amber-bg:#fbf1de;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai', sans-serif;
    background:linear-gradient(180deg,#eef1f0 0%, #e3e7e4 100%);
    color:var(--ink);
    min-height:100vh;
    padding:22px;
  }
  .app{
    max-width:1320px;
    margin:0 auto;
    padding-top:10px;
  }

  /* Print Button Header Styling */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--gold-500);
    color:var(--navy-950);
    border:none;padding:9px 16px;border-radius:9px;
    font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:inherit;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:transform .12s ease, background .12s ease;
  }
  .btn:hover{background:var(--gold-400); transform:translateY(-1px);}

  /* main card */
  .card{
    background:var(--paper);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(15,42,74,0.12);
    border:1px solid var(--line);
  }
  .card-header{
    background:linear-gradient(120deg, var(--navy-950), var(--navy-800));
    color:#fff;
    padding:24px 28px;
    display:flex; justify-content:space-between; align-items:center; gap:20px;
    border-bottom:4px solid var(--gold-500);
  }
  .header-left-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card-title{
    font-family:'Noto Serif Thai', serif;
    font-weight:700;
    font-size:22px;
    line-height:1.4;
    max-width:700px;
  }

  /* Tab Menu Design */
  .tab-menu {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }
  .tab-btn.active {
    background: var(--gold-500);
    color: var(--navy-950);
    border-color: var(--gold-500);
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(201, 162, 39, 0.25);
  }

  .header-right-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
    min-width: 250px;
  }
  .org{
    text-align:right; font-size:13px; line-height:1.6; color:var(--gold-100);
  }
  .org b{display:block; font-size:14.5px; color:#fff;}
  .org span{display:block;}

  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:640px;
  }
  /* sidebar */
  .sidebar{
    background:#f5f2e8;
    border-right:1px solid var(--line);
    padding:20px 16px;
  }
  .side-label{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px; font-weight:700; color:var(--navy-800);
    text-transform:uppercase; letter-spacing:.03em;
    margin:4px 0 8px;
  }
  select.school-select{
    width:100%; padding:10px 12px; border-radius:9px;
    border:1px solid var(--line); background:#fff;
    font-family:inherit; font-size:14px; color:var(--ink);
    margin-bottom:20px; cursor:pointer;
    outline:none;
  }
  select.school-select:focus{border-color:var(--gold-500);}
  .stu-list{display:flex; flex-direction:column; gap:8px; max-height:540px; overflow-y:auto; padding-right:4px;}
  .stu-item{
    background:#fff; border:1px solid var(--line); border-radius:11px;
    padding:10px 12px; cursor:pointer;
    transition:all .12s ease;
  }
  .stu-item:hover{border-color:var(--gold-500); transform:translateX(2px);}
  .stu-item.active{
    background:linear-gradient(120deg, var(--gold-500), var(--gold-400));
    border-color:var(--gold-500);
  }
  .stu-item .nm{font-weight:700; font-size:13.6px; color:var(--ink);}
  .stu-item.active .nm{color:var(--navy-950);}
  .stu-item .mj{font-size:11.8px; color:var(--ink-soft); margin-top:2px;}
  .stu-item.active .mj{color:var(--navy-800);}
  .stu-item .status-dot{
    display:inline-block; width:7px;height:7px;border-radius:50%; margin-right:6px;
  }
  .dot-pass{background:var(--green);}
  .dot-conditional{background:var(--amber);}
  .dot-fail{background:var(--red);}

  /* main panel */
  .main{padding:24px 28px 32px; overflow-y:auto;}
  .top-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:18px; margin-bottom:18px; flex-wrap:wrap;
  }
  .person{display:flex; gap:14px; align-items:center;}
  .avatar{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg, var(--navy-800), var(--navy-950));
    color:var(--gold-400); display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:19px; flex:none;
    border:2px solid var(--gold-500);
  }
  .person-name{font-family:'Noto Serif Thai',serif; font-weight:700; font-size:19px;}
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; padding:6px 14px; border-radius:99px;
    margin-top:5px;
  }
  .badge-pass{background:var(--green-bg); color:var(--green);}
  .badge-conditional{background:var(--amber-bg); color:var(--amber);}
  .badge-fail{background:var(--red-bg); color:var(--red);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .info-box{
    background:var(--cream); border:1px solid var(--line); border-radius:12px;
    padding:13px 15px;
  }
  .info-box .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .info-box .val{font-size:14.5px; font-weight:600; line-height:1.5;}

  .section{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:16px;
  }
  .section-title{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:14.5px; color:var(--navy-900);
    margin-bottom:12px;
  }
  .section-title .ic{
    width:22px;height:22px; border-radius:6px; background:var(--gold-100);
    color:var(--gold-500); display:flex; align-items:center; justify-content:center;
    font-size:12px; flex:none;
  }
  .content-static-block{
    font-size:13.8px; line-height:1.65; color:var(--ink);
    min-height:20px; white-space: pre-line;
  }

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
  @media (max-width:980px){.two-col{grid-template-columns:1fr;}}

  .criteria-list{display:flex; flex-direction:column; gap:10px;}
  .crit-item{
    display:flex; gap:10px; padding:11px 13px; border-radius:11px; align-items:flex-start;
  }
  .crit-pass{background:var(--green-bg);}
  .crit-fail{background:var(--red-bg);}
  .crit-na{background:#f2f2ee;}
  .crit-icon{
    width:20px;height:20px;border-radius:50%; flex:none; margin-top:1px;
    display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800; color:#fff;
  }
  .crit-icon.pass{background:var(--green);}
  .crit-icon.fail{background:var(--red);}
  .crit-icon.na{background:#9aa3ab;}
  .crit-text{flex:1;}
  .crit-label{font-size:13.4px; font-weight:600; line-height:1.5;}
  .crit-detail{font-size:12.6px; color:var(--ink-soft); margin-top:3px; line-height:1.55;}

  .advisor-block{margin-bottom:14px;}
  .advisor-block:last-child{margin-bottom:0;}
  .advisor-role{font-size:11.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-bottom:3px;}
  .advisor-name{font-size:14.5px; font-weight:700; color:var(--navy-900);}
  /* เพิ่ม white-space: pre-line เพื่อรองรับจุดไข่ปลาขึ้นบรรทัดใหม่ของอาจารย์ */
  .advisor-note{font-size:12.6px; color:var(--ink-soft); margin-top:3px; line-height:1.55; white-space: pre-line;}
  .advisor-block hr{border:none; border-top:1px dashed var(--line); margin:12px 0;}

  .footer-note{
    text-align:center; font-size:11.5px; color:#8b93a0; margin-top:16px; padding-bottom:4px;
  }

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#c9c2a8; border-radius:99px;}

  @media print{
    body{background:#fff; padding:0;}
    .sidebar, .footer-note, .tab-menu, .btn{display:none !important;}
    .layout{grid-template-columns:1fr;}
    .card{box-shadow:none; border:none;}
  }

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    .sidebar{border-right:none; border-bottom:1px solid var(--line);}
    .grid-2, .two-col{grid-template-columns:1fr;}
    .card-header { flex-direction: column; align-items: flex-start; }
    .header-right-group { align-items: flex-start; min-width: auto; margin-top: 10px; }
    .org { text-align: left; }
  }

  #loadingOverlay{
    position:fixed; inset:0; background:rgba(15,42,74,0.92);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; z-index:999; font-size:15px; font-weight:600;
  }
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.25); border-top-color:var(--gold-400);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

</div>

  activeFund = fundNum;

function schoolList(){
  const data = getActiveData();
  const set = [...new Set(data.map(d=>d.school))];
  return ["ทั้งหมด", ...set];
}

function filteredStudents(){
  const data = getActiveData();
  if(currentSchool === "ทั้งหมด") return data;
  return data.filter(d=>d.school===currentSchool);
}

function renderSchoolSelect(){
  const sel = document.getElementById('schoolSelect');
  if(!sel) return;
  sel.innerHTML = schoolList().map(s=>`<option value="${s}" ${s===currentSchool?'selected':''}>${s}</option>`).join('');
  sel.onchange = ()=>{
    currentSchool = sel.value;
    const list = filteredStudents();
    currentIndex = getActiveData().indexOf(list[0]);
    renderAll();
  };
}

function renderStuList(){
  const wrap = document.getElementById('stuList');
  if(!wrap) return;
  const list = filteredStudents();
  const activeData = getActiveData();
  
  wrap.innerHTML = list.map(s=>{
    const idx = activeData.indexOf(s);
    const active = idx===currentIndex ? 'active' : '';
    const dot = STATUS_META[s.status]?.dot || 'dot-conditional';
    return `<div class="stu-item ${active}" data-idx="${idx}">
      <div class="nm"><span class="status-dot ${dot}"></span>${s.name}</div>
      <div class="mj">${s.major}</div>
    </div>`;
  }).join('');
  
  [...wrap.querySelectorAll('.stu-item')].forEach(el=>{
    el.onclick = ()=>{ currentIndex = parseInt(el.dataset.idx); renderAll(); };
  });
}

function critRowHtml(c){
  const cls = c.result==='pass'?'crit-pass':(c.result==='fail'?'crit-fail':'crit-na');
  const icon = c.result==='pass'?'✓':(c.result==='fail'?'✕':'–');
  const iconCls = c.result==='pass'?'pass':(c.result==='fail'?'fail':'na');
  return `<div class="crit-item ${cls}">
    <div class="crit-icon ${iconCls}">${icon}</div>
    <div class="crit-text">
      <div class="crit-label">${c.label}</div>
      ${c.detail ? `<div class="crit-detail">${c.detail}</div>` : ''}
    </div>
  </div>`;
}

function renderMain(){
  const activeData = getActiveData();
  const s = activeData[currentIndex];
  if(!s) return;
  
  const meta = STATUS_META[s.status] || STATUS_META['conditional'];
  const initials = s.name.replace(/^(Mr\.|Miss|Mrs\.|นาย|นางสาว|นาง)\s*/,'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const main = document.getElementById('mainPanel');
  if(!main) return;
  
  main.innerHTML = `
    <div class="top-row">
      <div class="person">
        <div class="avatar">${initials}</div>
        <div>
          <div class="person-name">${s.name}</div>
          <div class="badge ${meta.badge}">${meta.label}</div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="info-box">
        <div class="lbl">สำนักวิชา / สาขาวิชา</div>
        <div class="val">${s.school}</div>
        <div class="val" style="font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:2px;">${s.major}</div>
      </div>
      <div class="info-box">
        <div class="lbl">${s.gpaLabel}</div>
        <div class="val">${s.gpaValue}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="info-box">
        <div class="lbl">แผนการศึกษา / ระยะเวลา</div>
        <div class="val" style="font-size:13.5px;">${s.plan}</div>
        <div class="val" style="font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:2px;">${s.duration}</div>
      </div>
      <div class="info-box">
        <div class="lbl">ประเภททุนที่สมัคร</div>
        <div class="val">${s.fundType || ('ทุนประเภทที่ ' + activeFund)}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="info-box" style="grid-column:1 / -1;">
        <div class="lbl">อัตราค่าธรรมเนียมการศึกษาตลอดหลักสูตร</div>
        <div class="val" style="font-size:13.5px;">
          <span>${s.tuitionPerTerm}</span> บาท/ภาคการศึกษา
          &nbsp;|&nbsp; รวมค่าเทอม <span>${s.tuitionTotal}</span> บาท
        </div>
        <div class="val" style="font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:2px;">
          ${s.monthly ? `ค่าใช้จ่ายรายเดือนตลอดหลักสูตร <span>${s.monthly}</span> บาท ·` : ''}
          รวมทั้งสิ้น <b>${s.grandTotal}</b> บาท
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span class="ic">✔</span>รายละเอียดผลประเมินตามเกณฑ์รับสมัคร</div>
      <div class="criteria-list">
        ${s.criteria.map(c=>critRowHtml(c)).join('')}
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="section">
          <div class="section-title"><span class="ic">📄</span>Dissertation Topic</div>
          <div class="content-static-block">${s.thesis}</div>
        </div>
        <div class="section">
          <div class="section-title"><span class="ic">📚</span>ผลงานตีพิมพ์ทางวิชาการ / ประสบการณ์ที่เกี่ยวข้อง</div>
          <div class="content-static-block">${s.publication}</div>
        </div>
        <!-- 💼 แยกกล่องประวัติการทำงานออกมาเป็นกล่องใหม่เดี่ยวๆ ด้านล่างผลงานตีพิมพ์ -->
        <div class="section">
          <div class="section-title"><span class="ic">💼</span>ประวัติการทำงาน (ถ้ามี)</div>
          <div class="content-static-block">${s.workHistory || 'ไม่มีข้อมูล'}</div>
        </div>
      </div>
      <div>
        <div class="section">
          <div class="section-title"><span class="ic">👥</span>ข้อมูลคณะกรรมการอาจารย์ที่ปรึกษา</div>
          <div class="advisor-block">
            <div class="advisor-role">อาจารย์ที่ปรึกษาหลัก</div>
            <div class="advisor-name">${s.advisorMain}</div>
            <div class="advisor-note">${s.advisorMainNote}</div>
          </div>
          <hr>
          <div class="advisor-block">
            <div class="advisor-role">อาจารย์ที่ปรึกษาร่วม / ผู้เชี่ยวชาญ (Co-advisor)</div>
            <div class="advisor-name">${s.advisorCo}</div>
            <div class="advisor-note">${s.advisorCoNote}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderAll(){
  renderSchoolSelect();
  renderStuList();
  renderMain();
}

function init(){
  switchFundTab(1);
  const overlay = document.getElementById('loadingOverlay');
  if(overlay) overlay.style.display = 'none';
}

init();
</script>
</body>
</html>
